<!DOCTYPE html>
<html lang="en" ng-app="monitorrent">

    <head>
        <title>TorrentWatch</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/angular-material/1.1.0-rc4/angular-material.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="styles/monitorrent.css">

        <script>
            (function () {
                var key = 'torrentwatch.theme';
                var mode = localStorage.getItem(key);
                if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
                    mode = 'system';
                }
                document.documentElement.setAttribute('data-theme', mode);
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var effective = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
                document.documentElement.setAttribute('data-theme-effective', effective);
            })();
        </script>

        <script src="https://code.jquery.com/jquery-1.11.3.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js"></script>
        <!-- Angular Material Dependencies -->
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular-route.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular-animate.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular-aria.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular-sanitize.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.5.5/angular-messages.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-material/1.1.0-rc4/angular-material.js"></script>

        <!-- @if MODE='index' -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ngInfiniteScroll/1.2.1/ng-infinite-scroll.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.11.2/moment.min.js"></script>
        <!-- @endif -->

        <meta name="viewport" content="initial-scale=1, width=device-width" />
        <meta name="theme-color" content="#0b1220" />
    </head>

    <body class="monitorrent tw-app" ng-controller="MainCtrl">
        <div class="tw-atmosphere" aria-hidden="true"></div>
        <div layout="row" class="mt-body">
            <div class="mt-content" flex>
                <md-toolbar class="tw-toolbar">
                    <div class="md-toolbar-tools tw-toolbar-tools">
                        <a href="#/" class="tw-brand">
                            <img class="tw-brand-mark" src="content/images/logo.svg" width="34" height="34" alt="">
                            <span class="tw-brand-text">
                                <span class="tw-brand-name">TorrentWatch</span>
                                <span class="tw-brand-meta">v.<!-- @echo VERSION --></span>
                            </span>
                        </a>
                        <!-- @if MODE='index' -->
                        <a href="{{newVersionUrl}}" ng-if="newVersionUrl" class="tw-update-pill">update available</a>
                        <span flex></span>
                        <md-button class="md-icon-button tw-icon-btn tw-theme-btn" aria-label="Theme" ng-click="cycleTheme()" title="Theme: {{twThemeLabel}}">
                            <md-icon md-svg-icon="{{twThemeIcon}}"></md-icon>
                            <span class="tw-theme-label">{{twThemeLabel}}</span>
                        </md-button>
                        <md-button class="md-icon-button tw-icon-btn" aria-label="Settings" href="#/settings">
                            <md-icon md-svg-icon="content/icons/settings.svg"></md-icon>
                        </md-button>
                        <md-button class="md-icon-button tw-icon-btn" aria-label="Logout" ng-click="exit()" ng-show="exit_visible">
                            <md-icon md-svg-icon="content/icons/exit-to-app.svg"></md-icon>
                        </md-button>
                        <!-- @endif -->
                        <!-- @if MODE='login' -->
                        <span flex></span>
                        <md-button class="md-icon-button tw-icon-btn tw-theme-btn" aria-label="Theme" ng-click="cycleTheme()" title="Theme: {{twThemeLabel}}">
                            <md-icon md-svg-icon="{{twThemeIcon}}"></md-icon>
                            <span class="tw-theme-label">{{twThemeLabel}}</span>
                        </md-button>
                        <!-- @endif -->
                    </div>
                </md-toolbar>
                <md-content layout="column" layout-align="start center" class="tw-main">
                    <!-- @if MODE='index' -->
                    <div ng-view class="md-padding mt-content-view"></div>
                    <!-- @endif -->
                    <!-- @if MODE='login' -->
                    <div layout="row" layout-align="center center" class="tw-login-main" flex>
                        <section class="tw-login-panel ng-cloak">
                            <p class="tw-login-kicker">Access</p>
                            <h1 class="tw-login-title">TorrentWatch</h1>
                            <p class="tw-login-sub">Enter your password to continue watching trackers.</p>
                            <form name="login" ng-submit="submit()" layout="column" layout-align="start stretch" class="tw-login-form">
                                <md-input-container flex class="tw-field">
                                    <label>Password</label>
                                    <input required md-no-asterisk type="password" name="password"
                                        ng-model="password" ng-change="passwordValidation.valid()">
                                    <div ng-messages="login.password.$error" md-auto-hide="false" ng-if="login.$submitted || login.password.$touched">
                                        <div ng-message="required" class="md-input-message-animation">Please enter your password</div>
                                        <div ng-message="wrongPassword" class="md-input-message-animation">Password is incorrect</div>
                                    </div>
                                </md-input-container>
                                <md-button type="submit" class="md-raised md-primary tw-cta" ng-disabled="login.$invalid">Sign in</md-button>
                            </form>
                        </section>
                    </div>
                    <!-- @endif -->
                </md-content>
            </div>
        </div>

        <!-- @if MODE='index' -->
        <script src="scripts/monitorrent.js?v=<!-- @echo COMMIT_HASH -->"></script>
        <!-- @endif -->
        <!-- @if MODE='login' -->
        <script>
            var app = angular.module('monitorrent', ['ngMaterial', 'ngMessages']);

            app.config(function ($mdThemingProvider) {
                $mdThemingProvider.theme('default')
                        .primaryPalette('blue-grey')
                        .accentPalette('amber');
            });

            app.factory('ThemeService', ['$window', '$rootScope', function ($window, $rootScope) {
                var STORAGE_KEY = 'torrentwatch.theme';
                var MODES = ['system', 'light', 'dark'];
                var LABELS = { system: 'System', light: 'Light', dark: 'Dark' };
                var ICONS = {
                    system: 'content/icons/theme-system.svg',
                    light: 'content/icons/theme-light.svg',
                    dark: 'content/icons/theme-dark.svg'
                };

                function readStored() {
                    var value = $window.localStorage.getItem(STORAGE_KEY);
                    return MODES.indexOf(value) >= 0 ? value : 'system';
                }

                function resolveEffective(mode) {
                    if (mode === 'light' || mode === 'dark') {
                        return mode;
                    }
                    if ($window.matchMedia && $window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        return 'dark';
                    }
                    return 'light';
                }

                function apply(mode) {
                    var root = $window.document.documentElement;
                    root.setAttribute('data-theme', mode);
                    var effective = resolveEffective(mode);
                    root.setAttribute('data-theme-effective', effective);
                    var meta = $window.document.querySelector('meta[name="theme-color"]');
                    if (meta) {
                        meta.setAttribute('content', effective === 'dark' ? '#0b1220' : '#f3f1ec');
                    }
                    $rootScope.twTheme = mode;
                    $rootScope.twThemeLabel = LABELS[mode];
                    $rootScope.twThemeIcon = ICONS[mode];
                }

                return {
                    init: function () { apply(readStored()); },
                    cycle: function () {
                        var next = MODES[(MODES.indexOf(readStored()) + 1) % MODES.length];
                        $window.localStorage.setItem(STORAGE_KEY, next);
                        apply(next);
                        return next;
                    }
                };
            }]);

            app.controller('MainCtrl', ['$scope', '$http', '$window', '$rootScope', 'ThemeService', function ($scope, $http, $window, $rootScope, ThemeService) {
                ThemeService.init();
                $scope.twThemeLabel = $rootScope.twThemeLabel;
                $scope.twThemeIcon = $rootScope.twThemeIcon;
                $scope.cycleTheme = function () {
                    ThemeService.cycle();
                    $scope.twThemeLabel = $rootScope.twThemeLabel;
                    $scope.twThemeIcon = $rootScope.twThemeIcon;
                };

                $scope.password = "";

                $scope.passwordValidation = {
                    valid: function () {
                        $scope.login.password.$setValidity('wrongPassword', true);
                    },
                    invalid: function () {
                        $scope.login.password.$setValidity('wrongPassword', false);
                    }
                };

                $scope.submit = function () {
                    $http.post('/api/login', {password: $scope.password}).then(function() {
                        $window.location.href = '/';
                    }, function() {
                        $scope.passwordValidation.invalid();
                    });
                };
            }]);
        </script>
        <!-- @endif -->
    </body>

</html>
